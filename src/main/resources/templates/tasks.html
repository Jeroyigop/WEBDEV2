<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        a {
            margin-right: 10px;
        }
    </style>
</head>
<body>

<h1>Task Tracker</h1>

<a href="/tasks/new">Add New Task</a>

<br><br>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.id}">1</td>
            <td th:text="${task.title}">Task Title</td>
            <td th:text="${task.description}">Description</td>
            <td th:text="${task.priority}">1</td>
            <td th:text="${task.status}">Pending</td>
            <td>
                <a th:href="@{/tasks/edit/{id}(id=${task.id})}">Edit</a>
                <a th:href="@{/tasks/delete/{id}(id=${task.id})}">Delete</a>
            </td>
        </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(tasks)}">
    No tasks available.
</p>

</body>
</html>
